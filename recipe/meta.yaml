{% set name = "confuse" %}
{% set version = "2.3.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 66123bd4b38dec9ae36dd9407a090fd764245fd717cbaa986a68e3a05056920e

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<310]

requirements:
  host:
    - python
    - pip
    - poetry-core
  run:
    - python
    - pyyaml
    - typing_extensions >=4.4  # [py<313]

test:
  source_files:
    - test
  imports:
    - confuse
  requires:
    - pip
    - pytest
  commands:
    - pip check
    - pytest -vv test

about:
  home: https://github.com/beetbox/confuse
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: painless YAML configuration
  description: |
    Confuse is a configuration library for Python that uses YAML.
    It takes care of defaults, overrides, type checking, command-line
    integration, human-readable errors, and standard OS-specific locations.
  doc_url: https://confuse.readthedocs.org
  dev_url: https://github.com/beetbox/confuse

extra:
  recipe-maintainers:
    - philip-khor
  skip-lints:
    # doc_url is redirecting
    - reachable_url
