{% set name = "confuse" %}
{% set version = "2.2.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 8e7600c3261852122eb5f17b24b06ab8e5437b21d6224853c1420c38ac469d3c

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<310]

requirements:
  host:
    - python
    - pip
    - poetry-core
  run:
    - python
    - pyyaml
    - typing_extensions >=4.4  # [py<313]

test:
  source_files:
    - test
  imports:
    - confuse
  requires:
    - pip
    - pytest
  commands:
    - pip check
    # E   OSError: [WinError 123] The filename, directory name, or volume label syntax is incorrect
    - pytest test -k "not (test_create_dir_if_none_exists or test_do_not_create_dir_if_lower_priority_exists or test_return_existing_dir)"  # [win]
    - pytest test  # [not win]

about:
  home: https://github.com/beetbox/confuse
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: painless YAML configuration
  description: |
    Confuse is a configuration library for Python that uses YAML.
    It takes care of defaults, overrides, type checking, command-line
    integration, human-readable errors, and standard OS-specific locations.
  doc_url: https://confuse.readthedocs.org
  dev_url: https://github.com/beetbox/confuse

extra:
  recipe-maintainers:
    - philip-khor
